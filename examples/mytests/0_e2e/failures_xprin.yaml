common:
  inputs:
    composition: ../../aws/composition.yaml
    functions: ../../aws/functions.yaml

tests:

# Render failures
- name: "Render failure (claim used as XR)"
  id: broken
  inputs:
    xr: ../../aws/claim.yaml
    crds:
    - ../../aws/xrd.yaml
  assertions:
    xprin:
    - name: "Successful assertion, it should never be shown"
      type: "Count"
      value: 2
    - name: "Failed assertion, it should never be shown"
      type: "Count"
      value: 0
  hooks:
    pre-test:
    - name: "Successful pre-test hook without output"
      run: exit
    - run: echo "hello"
    post-test:
    - name: "Successful post-test hook, it should never be shown"
      run: echo "bye"
    - name: "Failed post-test hook, it should never be shown"
      run: exit 2

# Assertions on errors: the render has to fail, and for the reason that the assertion says
- name: "Errors: the render fails, but not with the expected message"
  inputs:
    xr: ../../aws/claim.yaml
  assertions:
    errors:
    - name: "The render fails"
      phase: render
    - name: "The message is the one of another error"
      phase: render
      operator: contains
      value: "could not be evaluated, abort"

- name: "Errors: the render succeeds"
  inputs:
    xr: ../../aws/xr.yaml
  assertions:
    errors:
    - name: "The render fails"
      phase: render

- name: "Errors: validate fails, but not with the expected message"
  inputs:
    xr: ../../aws/xr_invalid.yaml
    crds:
    - ../../aws/xrd.yaml
    - ../../aws/crossplane.yaml
  assertions:
    errors:
    - name: "Validate fails"
      phase: validate
    - name: "The message is the one of another error"
      phase: validate
      operator: contains
      value: "spec.team: Required value"

- name: "Errors: validate succeeds"
  inputs:
    xr: ../../aws/xr.yaml
    crds:
    - ../../aws/xrd.yaml
    - ../../aws/crossplane.yaml
  assertions:
    errors:
    - name: "Validate fails"
      phase: validate

- name: "Errors: validate does not run, because there are no CRDs"
  inputs:
    xr: ../../aws/xr.yaml
  assertions:
    errors:
    - name: "Validate fails"
      phase: validate

# Validation failures
- name: "Validation failure (missing CRD)"
  inputs:
    xr: ../../aws/xr.yaml
    crds:
    - ../../gcp/xrd.yaml
    - ../../aws/crossplane.yaml
  assertions:
    xprin:
    - name: "Successful assertion"
      type: "Count"
      value: 2
  hooks:
    pre-test:
    - run: echo "hello"
    post-test:
    - run: echo "bye"

# Pre-test hook failures
- name: "Pre-test hook failure"
  inputs:
    xr: ../../aws/xr.yaml
    crds:
    - ../../aws/crossplane.yaml
  assertions:
    xprin:
    - name: "Successful assertion, it should never be shown"
      type: "Count"
      value: 2
    - name: "Failed assertion, it should never be shown"
      type: "Count"
      value: 0
  hooks:
    pre-test:
    - name: "Fail pre-test hook"
      run: exit 1
    - name: "Another failed pre-test hook, it should never be shown"
      run: exit 2
    post-test:
    - name: "Successful post-test hook, it should never be shown"
      run: echo "bye"
    - name: "Failed post-test hook, it should never be shown"
      run: exit 2
    - name: "Another successful post-test hook, it should never be shown"
      run: exit 3

- name: "Pre-test hook failure (unnamed)"
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    pre-test:
    - run: exit 1

- name: "Pre-test hook failure (multiline stderr)"
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    pre-test:
    - name: "Fail pre-test hook (multiline stderr)"
      run: |
        echo "first line" >&2
        echo "second line" >&2
        echo "third line" >&2
        exit 1

- name: "Pre-test hook failure (multiline stdout)"
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    pre-test:
    - name: "Fail pre-test hook (multiline stdout)"
      run: |
        echo "stdout line 1"
        echo "stdout line 2"
        exit 1

- name: "Pre-test hook failure (multiline stdout and stderr)"
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    pre-test:
    - name: "Fail pre-test hook (multiline stdout and stderr)"
      run: |
        echo "stdout 1"
        echo "stderr 2" >&2
        echo "stdout 3"
        echo "stderr 4" >&2
        exit 1

- name: "Successful test case"
  id: success
  inputs:
    xr: ../../aws/xr.yaml
    composition: ../../aws/composition.yaml
    functions: ../../aws/functions.yaml

# Post-claim-conversion hook failures
- name: "Post-claim-conversion hook failure"
  inputs:
    claim: ../../aws/claim.yaml
    composition: ../../aws/composition.yaml
    functions: ../../aws/functions.yaml
  assertions:
    xprin:
    - name: "Successful assertion, it should never be shown"
      type: "Count"
      value: 2
  hooks:
    post-claim-conversion:
    - name: "Fail post-claim-conversion hook"
      run: exit 1
    - name: "Another failed post-claim-conversion hook, it should never be shown"
      run: exit 2

- name: "Pre-test hook that uses the converted XR, template rendering error"
  inputs:
    claim: ../../aws/claim.yaml
    composition: ../../aws/composition.yaml
    functions: ../../aws/functions.yaml
  hooks:
    pre-test:
    - name: "Invalid pre-test hook (template rendering error: the claim is not converted yet)"
      run: echo "{{ .Converted.XR }}"

# Post-test hook failures
- name: "Post-test hook failure"
  inputs:
    xr: ../../aws/xr.yaml
    crds:
    - ../../aws/xrd.yaml
    - ../../aws/crossplane.yaml
  assertions:
    xprin:
    - name: "Successful assertion"
      type: "Count"
      value: 2
  hooks:
    pre-test:
    - run: echo "hello"
    post-test:
    - name: "Fail post-test hook"
      run: exit 1
    - name: Another failed post-test hook, it should never be shown"
      run: exit 2

- name: "Post-test hook that uses the output of a validate that did not run, template rendering error"
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    post-test:
    - name: "Post-test hook with a guard on the output of validate (it runs, there are no CRDs)"
      run: echo "validate=[{{ if .Outputs.Validate }}{{ .Outputs.Validate }}{{ else }}none{{ end }}]"
    - name: "Invalid post-test hook (template rendering error: validate did not run)"
      run: cat {{ .Outputs.Validate }}
    - name: "Successful post-test hook, it should never be shown"
      run: echo "bye"

- name: "Post-test hook that uses the output of assertions that did not run, template rendering error"
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    post-test:
    - name: "Post-test hook with a guard on the output of the assertions (it runs, there are no assertions)"
      run: echo "assertions=[{{ if .Outputs.Assertions }}{{ .Outputs.Assertions }}{{ else }}none{{ end }}]"
    - name: "Invalid post-test hook (template rendering error: no assertions ran)"
      run: cat {{ .Outputs.Assertions }}
    - name: "Successful post-test hook, it should never be shown"
      run: echo "bye"

- name: "Invalid Post-test hook, template rendering error"
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    post-test:
    - name: "Invalid post-test hook (template rendering error)"
      run: echo "{{ .Outputs.UnknownField }}"
    - name: "Successful post-test hook, it should never be shown"
      run: echo "bye"
    - name: "Failed post-test hook, it should never be shown"
      run: exit 2

- name: "Needs one that did not run validate, and uses its validate output, template rendering error"
  needs:
  - success
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    post-test:
    - name: "Post-test hook with a guard on the validate output of the one it needs (it runs, there is none)"
      run: echo "validate=[{{ if .Tests.success.Outputs.Validate }}{{ .Tests.success.Outputs.Validate }}{{ else }}none{{ end }}]"
    - name: "Invalid post-test hook (template rendering error: validate did not run in the one it needs)"
      run: cat {{ .Tests.success.Outputs.Validate }}
    - name: "Successful post-test hook, it should never be shown"
      run: echo "bye"

- name: "Needs one that had no assertions, and uses its assertions output, template rendering error"
  needs:
  - success
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    post-test:
    - name: "Post-test hook with a guard on the assertions output of the one it needs (it runs, there is none)"
      run: echo "assertions=[{{ if .Tests.success.Outputs.Assertions }}{{ .Tests.success.Outputs.Assertions }}{{ else }}none{{ end }}]"
    - name: "Invalid post-test hook (template rendering error: no assertions ran in the one it needs)"
      run: cat {{ .Tests.success.Outputs.Assertions }}
    - name: "Successful post-test hook, it should never be shown"
      run: echo "bye"

# Assertion failures
- name: "Assertion failure"
  id: assertion_failure
  inputs:
    xr: ../../aws/xr.yaml
    crds:
    - ../../aws/xrd.yaml
    - ../../aws/crossplane.yaml
  assertions:
    xprin:
    - name: "Resource count should be two"
      type: "Count"
      value: 2
    - name: "Resource count should be zero"
      type: "Count"
      value: 0
    - name: "FieldExists with wrong resource name"
      type: "FieldExists"
      resource: "Cluster/doesnotexist"
      field: "spec.forProvider.engine"
    - name: "FieldExists with non-existent field"
      type: "FieldExists"
      resource: "SecurityGroup/platform-aws-sg"
      field: "spec.forProvider.nonExistentField"
    - name: "Count with pattern expects too many Pods"
      type: "Count"
      resource: "Pod/*"
      value: 99
    - name: "Exists with pattern finds nothing"
      type: "Exists"
      resource: "Deployment/will-never-exist-*"
    - name: "FieldExists pattern matches nothing"
      type: "FieldExists"
      resource: "Cluster/no-such-name-*"
      field: "metadata.name"
    - name: "NotExists should fail - SecurityGroup exists"
      type: "NotExists"
      resource: "SecurityGroup/platform-aws-sg"
    - name: "FieldNotExists should fail - metadata.name exists"
      type: "FieldNotExists"
      resource: "SecurityGroup/platform-aws-sg"
      field: "metadata.name"
    - name: "FieldType should fail - wrong type"
      type: "FieldType"
      resource: "SecurityGroup/platform-aws-sg"
      field: "metadata.name"
      value: "number"
    - name: "FieldValue should fail - wrong value"
      type: "FieldValue"
      resource: "SecurityGroup/platform-aws-sg"
      field: "metadata.name"
      operator: "=="
      value: "wrong-value"
    diff:
    - name: "Full render matches golden (using diff)"
      expected: golden_full_render_broken.yaml
    - name: "SecurityGroup resource matches golden (using diff)"
      expected: golden_single_resource_broken.yaml
      resource: "SecurityGroup/platform-aws-sg"
    - name: "Failed to get golden file"
      expected: doesnotexist.yaml
    - name: "Wrong resource name"
      expected: golden_single_resource_broken.yaml
      resource: "SecurityGroup/doesnotexist"
    dyff:
    - name: "Full render matches golden (using dyff)"
      expected: golden_full_render_broken.yaml
    - name: "SecurityGroup resource matches golden (using dyff)"
      expected: golden_single_resource_broken.yaml
      resource: "SecurityGroup/platform-aws-sg"
    - name: "Failed to get golden file"
      expected: doesnotexist.yaml
    - name: "Wrong resource name"
      expected: golden_single_resource_broken.yaml
      resource: "SecurityGroup/doesnotexist"
  hooks:
    pre-test:
    - name: "Break golden files for diff/dyff failure tests"
      run: |
        # Only this test case uses these golden files (update-goldens writes them, and this breaks them), so that the
        # other testsuite files, which use golden_full_render.yaml of this directory, can run at the same time
        [ -f golden_full_render_broken.yaml ] && sed -i -e "s/team: devops/team: doesnotexist/" golden_full_render_broken.yaml
        [ -f golden_single_resource_broken.yaml ] && sed -i -e "s/region: us-west-2/region: eu-central-1/" golden_single_resource_broken.yaml
        rm -f doesnotexist.yaml
    post-test:
    - run: echo "bye"

# Combined failures
- name: "Failed validation and assertion"
  inputs:
    xr: ../../aws/xr.yaml
    crds:
    - ../../gcp/xrd.yaml
    - ../../aws/crossplane.yaml
  assertions:
    xprin:
    - name: "Successful assertion"
      type: "Count"
      value: 2
    - name: "Failed assertion"
      type: "Count"
      value: 0
  hooks:
    pre-test:
    - run: echo "hello"
    post-test:
    - run: echo "bye"

- name: "Failed validation, assertion, and post-test hook"
  inputs:
    xr: ../../aws/xr.yaml
    crds:
    - ../../gcp/xrd.yaml
    - ../../aws/crossplane.yaml
  assertions:
    xprin:
    - name: "Successful assertion"
      type: "Count"
      value: 2
    - name: "Failed assertion"
      type: "Count"
      value: 0
  hooks:
    pre-test:
    - run: echo "hello"
    post-test:
    - name: "Successful post-test hook"
      run: echo "bye"
    - name: "Failed post-test hook"
      run: exit 2

# needs: a test case can only use the outputs of the ones it lists, and is skipped when one of them failed or was skipped
- name: "Needs: a test case that needs the one that failed (skipped)"
  id: skipped
  needs:
  - broken
  inputs:
    xr: '{{ .Tests.broken.Outputs.XR }}'

- name: "Needs: a test case that needs the one that was skipped and the one that failed (skipped)"
  needs:
  - skipped
  - broken
  - success
  inputs:
    xr: ../../aws/xr.yaml

- name: "Needs: uses the outputs of a test case without listing it, with index (fails, it has to be listed in needs)"
  inputs:
    xr: '{{ (index .Tests "success").Outputs.XR }}'

- name: "Needs: uses the outputs of a test case that is not listed, in a hook (fails, it has to be listed in needs)"
  needs:
  - success
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    pre-test:
    - name: "Uses the outputs of a test case it does not list"
      run: echo "{{ .Tests.broken.Outputs.XR }}"

# What a test case can use with `.Tests`: only the ones it lists in `needs`, in a field and in a hook, and
# whether the ID is a test case of the file (the error says it has to be listed) or not (the original error)
- name: "Needs: no needs at all, uses the outputs of a test case that exists (fails, it has to be listed in needs)"
  inputs:
    xr: '{{ .Tests.success.Outputs.XR }}'

- name: "Needs: no needs at all, uses the outputs of a test case that does not exist (fails, map has no entry)"
  inputs:
    xr: '{{ .Tests.nonexistent.Outputs.XR }}'

- name: "Needs: no needs at all, uses the outputs of a test case that exists, in a hook (fails, it has to be listed in needs)"
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    pre-test:
    - name: "Uses the outputs of a test case it does not list"
      run: echo "{{ .Tests.success.Outputs.XR }}"

- name: "Needs: no needs at all, uses the outputs of a test case that does not exist, in a hook (fails, map has no entry)"
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    pre-test:
    - name: "Uses the outputs of a test case that does not exist"
      run: echo "{{ .Tests.nonexistent.Outputs.XR }}"

- name: "Needs: lists one, uses the outputs of another one that exists but is not listed (fails, it has to be listed in needs)"
  needs:
  - success
  inputs:
    xr: '{{ .Tests.broken.Outputs.XR }}'

- name: "Needs: lists one, uses the outputs of a test case that does not exist, in a hook (fails, map has no entry)"
  needs:
  - success
  inputs:
    xr: ../../aws/xr.yaml
  hooks:
    pre-test:
    - name: "Uses the outputs of a test case that does not exist"
      run: echo "{{ .Tests.nonexistent.Outputs.XR }}"

# Also with update-goldens: the golden files of a test case are not written when a test case it needs failed
- name: "Needs: golden files of a test case that needs the one with the assertion failures (skipped, also by update-goldens)"
  needs:
  - assertion_failure
  inputs:
    xr: ../../aws/xr.yaml
    crds:
    - ../../aws/xrd.yaml
    - ../../aws/crossplane.yaml
  assertions:
    diff:
    - name: "Full render matches golden"
      expected: golden_needs_skipped.yaml
