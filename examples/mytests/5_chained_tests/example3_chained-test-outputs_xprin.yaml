common:
  patches:
    xrd: ../../aws/xrd.yaml
  inputs:
    composition: ../../aws/composition.yaml
    functions: ../../aws/functions.yaml
    crds:
    - ../../aws/xrd.yaml
    - ../../aws/crossplane.yaml

tests:
- name: "Initial reconciliation loop"
  id: aws_first
  inputs:
    xr: ../../aws/xr.yaml
- name: "Second reconciliation loop"
  needs:
  - aws_first
  inputs:
    xr: {{ .Tests.aws_first.Outputs.XR }}
    observed-resources: ../../aws/observed
  hooks:
    pre-test:
    - name: "The outputs of the first test are also available in the hooks"
      run: test -f {{ .Tests.aws_first.Outputs.XR }}
