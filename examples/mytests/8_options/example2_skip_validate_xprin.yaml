    composition: ../../aws/composition.yaml
    functions: ../../aws/functions.yaml
    crds:
    - ../../aws/xrd.yaml
    - ../../aws/crossplane.yaml
  hooks:
    pre-test:
    - name: "Pre-test hook"
      run: echo "runs"
    post-test:
    - name: "Post-test hook"
      run: echo "runs"
  assertions:
    xprin:
    - name: "The resources were rendered"
      type: "Count"
      value: 2
