tests:
- name: "Runs as always"
  id: base
  inputs:
    xr: ../../aws/xr.yaml
    composition: ../../aws/composition.yaml
    functions: ../../aws/functions.yaml
  hooks:
    pre-test:
    - name: "Pre-test hook"
      run: echo "runs"
    post-test:
    - name: "Post-test hook"
      run: echo "runs"
  assertions:
    xprin:
    - name: "The resources were rendered"
      type: "Count"
      value: 2

- name: "Skipped for now"
  id: new_region
  options:
    skip: true
  inputs:
    xr: ../../aws/xr.yaml
    composition: ../../aws/composition.yaml
    functions: ../../aws/functions.yaml
  hooks:
    pre-test:
    - name: "Pre-test hook, it never runs"
      run: exit 1
    post-test:
    - name: "Post-test hook, it never runs"
      run: exit 1
  assertions:
    xprin:
    - name: "Assertion, it never runs"
      type: "Count"
      value: 0
    errors:
    - name: "The render fails, it never runs"
      phase: render

- name: "Needs the skipped one"
  needs:
  - new_region
  inputs:
    xr: ../../aws/xr.yaml
    composition: ../../aws/composition.yaml
    functions: ../../aws/functions.yaml
  hooks:
    pre-test:
    - name: "this will never run"
      run: ls {{ .Tests.new_region.Outputs.XR }}
